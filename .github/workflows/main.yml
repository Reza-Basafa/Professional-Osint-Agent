name: NEXUS OSINT Report

on:
  workflow_dispatch:
    inputs:
      target_type:
        description: "Public-source check type"
        required: true
        type: choice
        options: [domain, url, username, email, phone]
      target_value:
        description: "Domain, public URL, username, email, or phone with country code"
        required: true
        type: string
      authorized_scope:
        description: "I confirm I have permission to investigate this target"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Require authorization confirmation
        if: ${{ inputs.authorized_scope != true }}
        run: |
          echo "::error::Confirm authorization to investigate this target."
          exit 1
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run public-source OSINT
        env:
          TARGET_TYPE: ${{ inputs.target_type }}
          TARGET_VALUE: ${{ inputs.target_value }}
        run: |
          set -euo pipefail
          mkdir -p reports
          python osint_agent.py --type "$TARGET_TYPE" --target "$TARGET_VALUE" --out reports
      - name: Upload PDF and JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-osint-report-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
